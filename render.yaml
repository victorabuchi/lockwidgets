# Render Blueprint for the Notchlight website. In the Render dashboard: New, Blueprint, then pick this repo.
# It serves the docs folder as a static site and redeploys only when something in docs changes.
# The domain notchlight.com (www redirects to it) is connected in the dashboard, with its DNS at the registrar.
services:
  - type: web
    name: notchlight
    runtime: static
    branch: main
    buildCommand: echo "The website is plain files; nothing to build."
    staticPublishPath: ./docs
    autoDeploy: true
    buildFilter:
      paths:
        - docs/**
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Browsers check for a newer copy of each picture on every visit and get a quick "not modified" when nothing
      # changed, so every push shows up right away. The page's picture links carry ?v=2 to replace the copies browsers
      # kept for a week under the old setting.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
