name: LockWidgets
options:
  bundleIdPrefix: com.victorabuchi
  deploymentTarget:
    macOS: "15.0"
packages:
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    from: 1.0.0
targets:
  LockWidgets:
    type: application
    platform: macOS
    sources: [LockWidgets]
    dependencies:
      - package: SkyLightWindow
      - sdk: libsqlite3.tbd
    info:
      path: LockWidgets/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDisplayName: LockWidgets
        NSAppleEventsUsageDescription: LockWidgets reads the current song from Music and Spotify to show it on the lock screen.
        NSLocationUsageDescription: LockWidgets uses your location to show local weather.
        NSLocationWhenInUseUsageDescription: LockWidgets uses your location to show local weather.
        NSRemindersFullAccessUsageDescription: LockWidgets shows your open reminders on the lock screen.
        NSPhotoLibraryUsageDescription: LockWidgets shows your favourite photos on the lock screen.
        NSCalendarsFullAccessUsageDescription: LockWidgets shows your upcoming events on the lock screen.
    entitlements:
      path: LockWidgets/LockWidgets.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.photos-library: true
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorabuchi.LockWidgets
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: 4T4AXT6P7X
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
