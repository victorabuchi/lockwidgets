name: LockWidgets
options:
  bundleIdPrefix: com.victorabuchi
  deploymentTarget:
    macOS: "14.0"
packages:
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    from: 1.0.0
targets:
  LockWidgets:
    type: application
    platform: macOS
    sources: [LockWidgets]
    dependencies:
      - package: SkyLightWindow
    info:
      path: LockWidgets/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: LockWidgets
        NSLocationUsageDescription: LockWidgets uses your location to show local weather.
        NSLocationWhenInUseUsageDescription: LockWidgets uses your location to show local weather.
        NSCalendarsFullAccessUsageDescription: LockWidgets shows your upcoming events on the lock screen.
    entitlements:
      path: LockWidgets/LockWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.personal-information.location: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.victorabuchi.LockWidgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
